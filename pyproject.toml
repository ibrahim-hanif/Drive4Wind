[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MBs4Wind"
version = "0.1.0"
description = "Main bearing design, analysis and optimization (MDAO) for drivetrains of large floating offshore wind turbines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Vasudev Gupta", email = "vasudev.gupta@ntnu.no"}
]
keywords = ["wind", "turbine", "bearing", "design", "optimization", "MDAO"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "openmdao>=3.0.0",
    "matplotlib>=3.0.0",
    "nlopt>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
wisdem = [
    "wisdem>=3.0.0",
]
pyoptsparse = [
    "pyoptsparse>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/MBs4Wind"
Documentation = "https://github.com/yourusername/MBs4Wind/wiki"
Repository = "https://github.com/yourusername/MBs4Wind.git"
Issues = "https://github.com/yourusername/MBs4Wind/issues"

[tool.setuptools]
packages = ["MBs4Wind"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
